name: CI

# Runs on every push to main and on every pull request. A PR should not be
# merged unless both jobs are green.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # The same Postgres (with pgvector) and Redis the app uses in Docker.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: cis
          POSTGRES_PASSWORD: cis_password
          POSTGRES_DB: cis
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cis"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      # The tests create and use cis_test next to this database.
      DATABASE_URL: postgresql+psycopg://cis:cis_password@localhost:5432/cis
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci-only-secret-not-used-anywhere-else
      # No model files and no LLM key in CI: the rule-based stubs and fake
      # LLM clients in the tests are used instead.
      LLM_PROVIDER: ""

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Unit tests
        run: python -m pytest tests/unit

      # Includes the migration checks: models and migrations must match, and
      # every migration must downgrade and upgrade cleanly.
      - name: Integration tests with coverage (NFR-19, at least 70%)
        run: >-
          python -m pytest tests
          --cov=app --cov-report=term-missing:skip-covered
          --cov-fail-under=70

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package.json
      - run: npm install
      - run: npm run build
