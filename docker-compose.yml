services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: cis
      POSTGRES_PASSWORD: cis_password
      POSTGRES_DB: cis
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cis"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    # Apply pending migrations, then start the API. If a migration fails the
    # container exits instead of serving against a half-migrated schema.
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    env_file: .env
    volumes:
      - ./backend:/code
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: ./backend
    command: celery -A app.workers.celery_app worker -Q analysis -c 1 --loglevel=info
    env_file: .env
    environment:
      PYTHONPATH: /code:/ml_src
      HF_HOME: /hf_cache
      TOKENIZERS_PARALLELISM: "false"
    volumes:
      - ./backend:/code
      - ./ml/models:/models:ro
      - ./ml/src:/ml_src:ro
      - hf_cache:/hf_cache
    depends_on:
      - api
      - redis

  frontend:
    build: ./frontend
    command: npm run dev -- --host 0.0.0.0
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  pgdata:
  hf_cache:
